name: Test all labs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_structure.py
      - run: python3 scripts/test_all.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: guide-site/package-lock.json
      - run: npm ci
        working-directory: guide-site
      - run: npm run build
        working-directory: guide-site
      - run: npm run check
        working-directory: guide-site
